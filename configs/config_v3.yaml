# ============================================================
# Pneumonia Segmentation Config v3 — Next Experiment Setup
# Goal: Target Dice >= 0.70 via EfficientNet-B4 & High-Precision Focal Tuning
# Key Changes vs v2:
# 1. encoder_name: timm-efficientnet-b3 -> timm-efficientnet-b4 (Higher capacity feature extractor)
# 2. encoder_lr_factor: 0.02 -> 0.015 (66x slower encoder update to safeguard pretrained weights)
# 3. loss.tversky_alpha: 0.3 -> 0.25, tversky_beta: 0.7 -> 0.75 (3.0x FP penalty vs FN)
# 4. encoder_freeze_epochs: 12 -> 15 (extended decoder warmup phase)
# 5. epochs: 100 -> 120, early_stopping_patience: 35 -> 40
# 6. weight_decay: 5e-4 -> 6e-4 (stronger L2 regularization)
# 7. inference.threshold: 0.65 -> 0.70 (sharper probability thresholding)
# ============================================================

# ------ Dataset Paths ------
data:
  rsna_root: "data/rsna-pneumonia-detection-challenge"
  train_dicom_dir: "data/rsna-pneumonia-detection-challenge/stage_2_train_images"
  test_dicom_dir: "data/rsna-pneumonia-detection-challenge/stage_2_test_images"
  train_labels_csv: "data/rsna-pneumonia-detection-challenge/stage_2_train_labels.csv"
  class_info_csv: "data/rsna-pneumonia-detection-challenge/stage_2_detailed_class_info.csv"
  mask_dir: "data/lung_masks/combined"
  lung_mask_dir: "data/lung_masks/lung_segmentation"
  test_lung_mask_dir: "data/lung_masks/test"
  negative_ratio: 0.05
  rle_csv: null

# ------ Preprocessing ------
preprocessing:
  image_size: [512, 512]
  window_level: -600
  window_width: 1500
  apply_lung_window: false
  normalize: true
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  use_clahe: true
  clahe_clip_limit: 2.0
  clahe_grid_size: [8, 8]

# ------ Model ------
model:
  architecture: "Unet"
  encoder_name: "timm-efficientnet-b4"
  encoder_weights: "imagenet"
  in_channels: 3
  classes: 1
  activation: null
  decoder_attention_type: "scse"
  decoder_channels: [256, 128, 64, 32, 16]
  decoder_dropout: 0.2
  auxiliary_head: true
  auxiliary_head_weight: 0.35

# ------ Training ------
training:
  batch_size: 8
  epochs: 120
  num_workers: 4
  pin_memory: true
  use_amp: true
  cuda_alloc_conf: "expandable_segments:True"
  accumulation_steps: 4
  seed: 42
  val_split: 0.2
  k_folds: 1
  fold: 0
  stratified_split: true
  early_stopping_patience: 40
  encoder_freeze_epochs: 15
  gradient_clip_val: 1.0
  use_ema: true
  ema_decay: 0.9995
  monitor_metric: "val_dice"
  monitor_mode: "max"
  save_top_k: 3

# ------ Optimizer ------
optimizer:
  type: "adamw"
  lr: 3.5e-4
  weight_decay: 6.0e-4
  encoder_lr_factor: 0.015

# ------ Learning Rate Scheduler ------
scheduler:
  type: "cosine_annealing"
  cosine_t_max: 120
  cosine_eta_min: 1.0e-6
  pct_start: 0.3
  div_factor: 25.0
  final_div_factor: 1e4
  reduce_factor: 0.5
  reduce_patience: 5
  reduce_min_lr: 1.0e-6

# ------ Loss Function ------
loss:
  type: "unified_focal"
  bce_weight: 0.4
  tversky_alpha: 0.25
  tversky_beta: 0.75
  tversky_gamma: 0.80
  pos_weight: 1.0
  focal_alpha: 0.25
  focal_gamma: 2.0

# ------ Data Augmentation ------
augmentation:
  enabled: true
  horizontal_flip_prob: 0.5
  rotation_limit: 10
  shift_limit: 0.1
  scale_limit: 0.15
  elastic_transform_prob: 0.0
  elastic_alpha: 120
  elastic_sigma: 6
  brightness_limit: 0.2
  contrast_limit: 0.2
  brightness_contrast_prob: 0.4
  coarse_dropout_prob: 0.10
  coarse_dropout_holes: 8
  coarse_dropout_max_size: 32
  grid_distortion_prob: 0.15
  grid_distortion_limit: 0.08

# ------ Inference ------
inference:
  model_path: "outputs/checkpoints/best_model.pth"
  threshold: 0.70
  use_tta: true
  tta_transforms: ["null", "hflip", "vflip"]
  tta_merge_mode: "mean"
  output_dir: "outputs/predictions"
  save_overlay: true
  overlay_color: [0, 0, 255]
  overlay_alpha: 0.4

# ------ Evaluation ------
evaluation:
  output_dir: "outputs/evaluation"
  num_visualization_samples: 16
  metrics: ["dice", "iou", "precision", "recall", "accuracy", "specificity", "auc"]
  save_metrics_file: "outputs/evaluation/metrics.json"

# ------ Explainability (Grad-CAM) ------
explainability:
  enabled: true
  target_layer: null
  output_dir: "outputs/gradcam"
  colormap: "jet"

# ------ Web App (Gradio) ------
app:
  port: 7860
  host: "0.0.0.0"
  share: false
  title: "Deteksi & Lokalisasi Area Pneumonia pada Chest X-Ray"
  description: "Aplikasi Web Deteksi Pneumonia berbasis Attention U-Net."

# ------ Output / Logging ------
output:
  root: "outputs"
  checkpoints_dir: "outputs/checkpoints"
  logs_dir: "outputs/logs"
  tensorboard_dir: "outputs/tensorboard"
