# ============================================================
# Pneumonia Segmentation Config v1 — Baseline Config
# Strategy: Standard UNet + SCSE + OneCycleLR + Dice/BCE Loss
# ============================================================

# ------ Dataset Paths ------
data:
  rsna_root: "data/rsna-pneumonia-detection-challenge"
  train_dicom_dir: "data/rsna-pneumonia-detection-challenge/stage_2_train_images"
  test_dicom_dir: "data/rsna-pneumonia-detection-challenge/stage_2_test_images"
  train_labels_csv: "data/rsna-pneumonia-detection-challenge/stage_2_train_labels.csv"
  class_info_csv: "data/rsna-pneumonia-detection-challenge/stage_2_detailed_class_info.csv"
  mask_dir: "data/lung_masks/combined"
  lung_mask_dir: "data/lung_masks/lung_segmentation"
  test_lung_mask_dir: "data/lung_masks/test"
  negative_ratio: 0.30
  rle_csv: null

# ------ Preprocessing ------
preprocessing:
  image_size: [512, 512]
  window_level: -600
  window_width: 1500
  apply_lung_window: false
  normalize: true
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  use_clahe: true
  clahe_clip_limit: 2.0
  clahe_grid_size: [8, 8]

# ------ Model ------
model:
  architecture: "Unet"
  encoder_name: "timm-efficientnet-b3"
  encoder_weights: "imagenet"
  in_channels: 3
  classes: 1
  activation: null
  decoder_attention_type: "scse"
  decoder_channels: [256, 128, 64, 32, 16]
  decoder_dropout: 0.3
  auxiliary_head: true
  auxiliary_head_weight: 0.4

# ------ Training ------
training:
  batch_size: 4
  epochs: 100
  num_workers: 4
  pin_memory: true
  use_amp: true
  cuda_alloc_conf: "expandable_segments:True"
  accumulation_steps: 8
  seed: 42
  val_split: 0.2
  k_folds: 1
  fold: 0
  stratified_split: true
  early_stopping_patience: 20
  encoder_freeze_epochs: 8
  gradient_clip_val: 1.0
  use_ema: true
  ema_decay: 0.999
  monitor_metric: "val_dice"
  monitor_mode: "max"
  save_top_k: 3

# ------ Optimizer ------
optimizer:
  type: "adamw"
  lr: 3.0e-4
  weight_decay: 1.0e-4
  encoder_lr_factor: 0.1

# ------ Learning Rate Scheduler ------
scheduler:
  type: "one_cycle"
  pct_start: 0.3
  div_factor: 25.0
  final_div_factor: 1e4
  reduce_factor: 0.5
  reduce_patience: 5
  reduce_min_lr: 1.0e-6

# ------ Loss Function ------
loss:
  type: "dice_bce"
  bce_weight: 0.3
  tversky_alpha: 0.4
  tversky_beta: 0.6
  tversky_gamma: 0.75
  pos_weight: 2.0
  focal_alpha: 0.25
  focal_gamma: 2.0

# ------ Data Augmentation ------
augmentation:
  enabled: true
  horizontal_flip_prob: 0.5
  rotation_limit: 15
  shift_limit: 0.1
  scale_limit: 0.15
  elastic_transform_prob: 0.1
  elastic_alpha: 120
  elastic_sigma: 6
  brightness_limit: 0.15
  contrast_limit: 0.15
  brightness_contrast_prob: 0.3
  coarse_dropout_prob: 0.15
  coarse_dropout_holes: 4
  coarse_dropout_max_size: 32
  grid_distortion_prob: 0.2
  grid_distortion_limit: 0.1

# ------ Inference ------
inference:
  model_path: "outputs/checkpoints/best_model.pth"
  threshold: 0.50
  use_tta: true
  tta_transforms: ["null", "hflip", "vflip"]
  tta_merge_mode: "mean"
  output_dir: "outputs/predictions"
  save_overlay: true
  overlay_color: [0, 0, 255]
  overlay_alpha: 0.4

# ------ Evaluation ------
evaluation:
  output_dir: "outputs/evaluation"
  num_visualization_samples: 16
  metrics: ["dice", "iou", "precision", "recall", "accuracy", "specificity", "auc"]
  save_metrics_file: "outputs/evaluation/metrics.json"

# ------ Explainability (Grad-CAM) ------
explainability:
  enabled: true
  target_layer: null
  output_dir: "outputs/gradcam"
  colormap: "jet"

# ------ Web App (Gradio) ------
app:
  port: 7860
  host: "0.0.0.0"
  share: false
  title: "Deteksi & Lokalisasi Area Pneumonia pada Chest X-Ray"
  description: "Web application untuk deteksi pneumonia berbasis Attention U-Net."

# ------ Output / Logging ------
output:
  root: "outputs"
  checkpoints_dir: "outputs/checkpoints"
  logs_dir: "outputs/logs"
  tensorboard_dir: "outputs/tensorboard"
