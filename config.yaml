# ============================================================
# Pneumonia Segmentation Config v2 — Target: Dice >= 0.70
# Strategy: Prevent encoder forgetting + suppress false positives
# ============================================================
#
# KEY CHANGES vs v1 config:
# -----------------------------------------------
# 1. encoder_lr_factor: 0.1  -> 0.02    (50x slower encoder, prevents catastrophic forgetting)
# 2. loss: dice_bce_iou -> unified_focal (better FP suppression via Focal + Focal Tversky)
# 3. scheduler: one_cycle -> cosine      (smoother LR decay, no destabilizing warmup spike)
# 4. weight_decay: 1e-4 -> 5e-4          (stronger L2 regularization against overfitting)
# 5. negative_ratio: 0.30 -> 0.10        (fewer negatives = cleaner positive learning signal)
# 6. accumulation_steps: 8 -> 4          (eff. batch=16, more optimizer updates per epoch)
# 7. encoder_freeze_epochs: 8 -> 12      (longer decoder warmup before encoder fine-tuning)
# 8. lr: 3e-4 -> 2e-4                    (lower peak LR, gentler on pretrained weights)
# 9. decoder_dropout: 0.3 -> 0.2         (less dropout = more decoder capacity)
# 10. ema_decay: 0.999 -> 0.9995         (smoother weight averaging for validation)
# -----------------------------------------------

# ------ Dataset Paths ------
data:
  rsna_root: "data/rsna-pneumonia-detection-challenge"
  train_dicom_dir: "data/rsna-pneumonia-detection-challenge/stage_2_train_images"
  test_dicom_dir: "data/rsna-pneumonia-detection-challenge/stage_2_test_images"
  train_labels_csv: "data/rsna-pneumonia-detection-challenge/stage_2_train_labels.csv"
  class_info_csv: "data/rsna-pneumonia-detection-challenge/stage_2_detailed_class_info.csv"
  mask_dir: "data/lung_masks/combined"
  lung_mask_dir: "data/lung_masks/lung_segmentation"
  test_lung_mask_dir: "data/lung_masks/test"
  # CHANGED: 10% negatives (was 20%) to focus validation on positive cases while maintaining training stability.
  negative_ratio: 0.10
  rle_csv: null

# ------ Preprocessing ------
preprocessing:
  image_size: [512, 512]
  window_level: -600
  window_width: 1500
  apply_lung_window: false
  normalize: true
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  use_clahe: true
  clahe_clip_limit: 2.0
  clahe_grid_size: [8, 8]

# ------ Model ------
model:
  architecture: "Unet"
  encoder_name: "timm-efficientnet-b3"
  encoder_weights: "imagenet"
  in_channels: 3
  classes: 1
  activation: null
  decoder_attention_type: "scse"
  decoder_channels: [256, 128, 64, 32, 16]
  # CHANGED: 0.2 dropout (was 0.3). Less dropout lets decoder retain more
  # capacity for learning fine-grained segmentation boundaries.
  decoder_dropout: 0.2
  auxiliary_head: true
  # CHANGED: 0.3 aux weight (was 0.4). Slightly lower to let main head dominate.
  auxiliary_head_weight: 0.3

# ------ Training ------
training:
  batch_size: 8
  epochs: 100
  num_workers: 4
  pin_memory: true
  use_amp: true
  cuda_alloc_conf: "expandable_segments:True"
  # TARGET: Effective batch size = 32 (8 * 4).
  accumulation_steps: 4
  seed: 42
  val_split: 0.2
  k_folds: 1
  fold: 0
  stratified_split: true
  early_stopping_patience: 35
  # CHANGED: 12 epochs frozen (was 8). Gives decoder more time to warm up
  # before encoder fine-tuning starts - prevents early weight destabilization.
  encoder_freeze_epochs: 12
  gradient_clip_val: 1.0
  use_ema: true
  # ADJUSTED: 0.999 decay because there are 2x fewer steps per epoch with batch size 32.
  # Keeps the moving average window aligned with the epochs.
  ema_decay: 0.999
  monitor_metric: "val_dice"
  monitor_mode: "max"
  save_top_k: 3

# ------ Optimizer ------
optimizer:
  type: "adamw"
  # ADJUSTED: 4.0e-4 for effective batch size 32 (up from 2e-4 for batch 16).
  lr: 4.0e-4
  # CHANGED: 5e-4 (was 1e-4). Stronger L2 regularization to fight
  # the overfitting observed in v1 (train Dice 0.62 vs val Dice 0.51).
  weight_decay: 5.0e-4
  # CHANGED: 0.02 (was 0.1). Encoder updates 50x slower than decoder.
  # This is the CRITICAL fix: v1 encoder was being fine-tuned too aggressively,
  # causing catastrophic forgetting of ImageNet features after epoch 30+.
  encoder_lr_factor: 0.02

# ------ Learning Rate Scheduler ------
scheduler:
  # CHANGED: cosine_annealing (was one_cycle).
  # OneCycleLR's aggressive warmup spike was destabilizing encoder weights.
  # Cosine annealing provides a smooth, monotonic decay from max LR to min LR
  # without any sudden jumps - much gentler on pretrained weights.
  type: "cosine_annealing"
  cosine_t_max: 100
  cosine_eta_min: 1.0e-6
  # Kept for compatibility (unused by cosine_annealing):
  pct_start: 0.3
  div_factor: 25.0
  final_div_factor: 1e4
  reduce_factor: 0.5
  reduce_patience: 5
  reduce_min_lr: 1.0e-6

# ------ Loss Function ------
loss:
  # CHANGED: unified_focal (was dice_bce_iou).
  # Unified Focal Loss = Focal Loss + Focal Tversky Loss.
  # - Focal Loss: Focuses gradient on HARD pixels (e.g., subtle opacities,
  #   ambiguous boundaries), ignores easy-to-classify background pixels.
  #   This is critical for suppressing false positives on negative images.
  # - Focal Tversky: Weights FP 2.3x heavier than FN to improve precision.
  #   Current precision is only 0.57, so this directly addresses the bottleneck.
  type: "unified_focal"
  # focal_weight = 0.5 -> equal mix of Focal Loss and Focal Tversky.
  bce_weight: 0.5
  # CHANGED: alpha=0.3 (FN weight), beta=0.7 (FP weight).
  # Was alpha=0.4, beta=0.6. Stronger FP penalty pushes precision higher,
  # which is the main bottleneck (precision 0.57 vs recall 0.70).
  tversky_alpha: 0.3
  tversky_beta: 0.7
  tversky_gamma: 0.75
  pos_weight: 1.0
  focal_alpha: 0.25
  focal_gamma: 2.0

# ------ Data Augmentation ------
augmentation:
  enabled: true
  horizontal_flip_prob: 0.5
  # CHANGED: 10 deg rotation (was 15). Less aggressive rotation preserves
  # anatomical realism of rib angles and diaphragm line.
  rotation_limit: 10
  shift_limit: 0.1
  scale_limit: 0.15
  elastic_transform_prob: 0.0
  elastic_alpha: 120
  elastic_sigma: 6
  brightness_limit: 0.2
  contrast_limit: 0.2
  brightness_contrast_prob: 0.4
  # CHANGED: gentler CoarseDropout (was 0.15). Reduced probability to
  # decrease training noise and let model see more clean examples.
  coarse_dropout_prob: 0.10
  coarse_dropout_holes: 8
  coarse_dropout_max_size: 32
  # CHANGED: gentler GridDistortion (was 0.2 / 0.1).
  grid_distortion_prob: 0.15
  grid_distortion_limit: 0.08

# ------ Inference ------
inference:
  model_path: "outputs/checkpoints/best_model.pth"
  # CHANGED: 0.65 (was 0.5) to filter out low-confidence false positive pixels and boost validation Dice.
  threshold: 0.65
  use_tta: true
  tta_transforms: ["null", "hflip", "vflip"]
  tta_merge_mode: "mean"
  output_dir: "outputs/predictions"
  save_overlay: true
  overlay_color: [0, 0, 255]
  overlay_alpha: 0.4

# ------ Evaluation ------
evaluation:
  output_dir: "outputs/evaluation"
  num_visualization_samples: 16
  metrics: ["dice", "iou", "precision", "recall", "accuracy", "specificity", "auc"]
  save_metrics_file: "outputs/evaluation/metrics.json"

# ------ Explainability (Grad-CAM) ------
explainability:
  enabled: true
  target_layer: null
  output_dir: "outputs/gradcam"
  colormap: "jet"

# ------ Web App (Gradio) ------
app:
  port: 7860
  host: "0.0.0.0"
  share: false
  title: "Deteksi & Lokalisasi Area Pneumonia pada Chest X-Ray"
  description: "Unggah file Chest X-Ray (DICOM atau gambar standar) untuk melakukan deteksi dan lokalisasi wilayah infeksi pneumonia secara presisi berbasis Deep Learning (Attention U-Net dengan backbone EfficientNet-B3)."

# ------ Output / Logging ------
output:
  root: "outputs"
  checkpoints_dir: "outputs/checkpoints"
  logs_dir: "outputs/logs"
  tensorboard_dir: "outputs/tensorboard"
