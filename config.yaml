# ============================================================
# Pneumonia Segmentation Configuration
# ============================================================
# Framework: PyTorch + segmentation_models_pytorch
# Dataset: RSNA Pneumonia Detection Challenge (DICOM + bounding boxes)
# ============================================================

# ------ Dataset Paths ------
data:
  # Root directory for RSNA dataset
  rsna_root: "data/rsna-pneumonia-detection-challenge"
  # Path to train DICOM images
  train_dicom_dir: "data/rsna-pneumonia-detection-challenge/stage_2_train_images"
  # Path to test DICOM images (no labels)
  test_dicom_dir: "data/rsna-pneumonia-detection-challenge/stage_2_test_images"
  # CSV with bounding box annotations
  train_labels_csv: "data/rsna-pneumonia-detection-challenge/stage_2_train_labels.csv"
  # CSV with detailed class info (Normal / Lung Opacity / No Lung Opacity Not Normal)
  class_info_csv: "data/rsna-pneumonia-detection-challenge/stage_2_detailed_class_info.csv"
  # Optional: directory of precomputed mask PNGs (if available)
  mask_dir: "data/lung_masks/pneumonia_ground_truth"
  # Optional: directory of precomputed lung mask PNGs to mask input images
  lung_mask_dir: "data/lung_masks/lung_segmentation"
  # Optional: directory of precomputed mask PNGs from RLE CSV
  rle_csv: null

# ------ Preprocessing ------
preprocessing:
  # Target image size (height, width)
  image_size: [512, 512]
  # Lung window settings (Hounsfield Units)
  window_level: -600
  window_width: 1500
  # Whether to apply lung windowing (set false for plain X-rays)
  apply_lung_window: true
  # Normalize pixel values to [0, 1]
  normalize: true
  # Lung mask dir is configured under the data section above

# ------ Model ------
model:
  # Architecture: "Unet", "UnetPlusPlus", "FPN", "DeepLabV3Plus"
  architecture: "UnetPlusPlus"
  # Encoder backbone: "resnet34", "resnet50", "efficientnet-b3", "timm-efficientnet-b4"
  encoder_name: "timm-efficientnet-b4"
  # Pretrained encoder weights: "imagenet" or null
  encoder_weights: "imagenet"
  # Number of input channels (1 for grayscale, 3 for RGB/pseudo-RGB)
  in_channels: 3
  # Number of output classes (1 for binary segmentation)
  classes: 1
  # Activation function for output layer: "sigmoid" for binary
  activation: null  # We apply sigmoid in loss/inference manually
  # Decoder attention type: "scse" (Spatial & Channel Squeeze-Excitation) or null
  decoder_attention_type: "scse"

# ------ Training ------
training:
  # Batch size
  batch_size: 4
  # Number of epochs
  epochs: 50
  # Number of dataloader workers
  num_workers: 4
  # Pin memory for faster GPU transfer
  pin_memory: true
  # Mixed precision training
  use_amp: true
  # Gradient accumulation steps (effective batch = batch_size * accumulation_steps)
  accumulation_steps: 4
  # Random seed for reproducibility
  seed: 42
  # Train/validation split ratio
  val_split: 0.2
  # K-Fold cross-validation (set to 1 to disable, >1 to enable)
  k_folds: 1
  # Current fold to train (0-indexed, used when k_folds > 1)
  fold: 0
  # Split by patient ID to avoid data leakage
  stratified_split: true
  # Early stopping patience (epochs)
  early_stopping_patience: 20
  # Number of epochs to freeze the encoder backbone at start (warmup)
  encoder_freeze_epochs: 0

# ------ Optimizer ------
optimizer:
  # Optimizer type: "adamw", "adam", "sgd"
  type: "adamw"
  # Initial learning rate
  lr: 3.0e-4
  # Weight decay (L2 regularization)
  weight_decay: 7.0e-4

# ------ Learning Rate Scheduler ------
scheduler:
  # Scheduler type: "reduce_on_plateau", "cosine_annealing", "one_cycle"
  type: "cosine_annealing"
  # ReduceLROnPlateau settings
  reduce_factor: 0.5
  reduce_patience: 6
  reduce_min_lr: 1.0e-7
  # CosineAnnealing settings
  cosine_t_max: 50
  cosine_eta_min: 1.0e-7

# ------ Loss Function ------
loss:
  # Loss type: "dice_bce", "focal_tversky", "dice", "bce"
  type: "focal_tversky"
  # Weight for BCE in combined loss (dice weight = 1 - bce_weight)
  bce_weight: 0.5
  # Focal Tversky parameters
  tversky_alpha: 0.7
  tversky_beta: 0.3
  tversky_gamma: 0.75
  # Class weight for positive pixels (pneumonia) to handle imbalance
  pos_weight: 3.0

# ------ Data Augmentation ------
augmentation:
  # Enable augmentation during training
  enabled: true
  # Horizontal flip probability
  horizontal_flip_prob: 0.5
  # Rotation limit (degrees)
  rotation_limit: 15
  # Shift-Scale-Rotate
  shift_limit: 0.1
  scale_limit: 0.15
  # Elastic transform
  elastic_transform_prob: 0.1
  elastic_alpha: 120
  elastic_sigma: 6
  # Random brightness/contrast
  brightness_limit: 0.15
  contrast_limit: 0.15
  brightness_contrast_prob: 0.3

# ------ Inference ------
inference:
  # Path to the best saved model checkpoint
  model_path: "outputs/best_model.pth"
  # Prediction threshold for binary mask
  threshold: 0.5
  # Enable Test-Time Augmentation
  use_tta: true
  # Number of TTA augmentations (horizontal flip, etc.)
  tta_transforms: ["hflip"]
  # Output directory for predictions
  output_dir: "outputs/predictions"
  # Save overlay images
  save_overlay: true
  # Overlay color (BGR for OpenCV) for pneumonia regions
  overlay_color: [0, 0, 255]
  # Overlay transparency (0-1)
  overlay_alpha: 0.4

# ------ Evaluation ------
evaluation:
  # Output directory for evaluation results
  output_dir: "outputs/evaluation"
  # Number of random samples to visualize
  num_visualization_samples: 16
  # Metrics to compute
  metrics: ["dice", "iou", "precision", "recall", "accuracy", "specificity", "auc"]
  # Save metrics to file
  save_metrics_file: "outputs/evaluation/metrics.json"

# ------ Explainability (Grad-CAM) ------
explainability:
  # Enable Grad-CAM generation
  enabled: true
  # Target layer for Grad-CAM (auto-detect if null)
  target_layer: null
  # Output directory
  output_dir: "outputs/gradcam"
  # Colormap for heatmap
  colormap: "jet"

# ------ Web App (Gradio) ------
app:
  # Server port
  port: 7860
  # Server host
  host: "0.0.0.0"
  # Share publicly (Gradio)
  share: false
  # Title
  title: "Pneumonia Segmentation from Chest X-Ray"
  # Description
  description: "Upload a DICOM chest X-ray to detect and segment pneumonia regions using deep learning (Attention UNet++ with EfficientNet-B4 backbone)."

# ------ Output / Logging ------
output:
  # Root output directory
  root: "outputs"
  # Checkpoints directory
  checkpoints_dir: "outputs/checkpoints"
  # Logs directory
  logs_dir: "outputs/logs"
  # TensorBoard log directory
  tensorboard_dir: "outputs/tensorboard"
