[project]
name = "pneumonia-unetpp"
version = "1.0.0"
description = "Segmentasi Citra Radiografi Dada untuk Pendeteksian Pneumonia dengan Attention UNet++"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "segmentation-models-pytorch>=0.4.0",
    "albumentations>=2.0.0",
    "opencv-python>=4.10.0",
    "pydicom>=3.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
    "tensorboard>=2.18.0",
    "matplotlib>=3.9.0",
    "gradio>=5.0.0",
    "scikit-learn>=1.5.0",
    "pillow>=11.0.0",
    "timm>=1.0.0",
    "torchxrayvision>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.uv.workspace]
members = [
    "journal/pdf_to_md_project",
]
